<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sala LED</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero">
        <div class="container">
            <div class="hero-content">
                <span class="eyebrow">Portal de referências</span>
                <h1><i class="fas fa-layer-group"></i> Portal Sala LED</h1>
                <p class="subtitle">Uma vitrine organizada de projetos, temas e autores para consulta rápida.</p>
                <div class="hero-stats" aria-label="Resumo do portal">
                    <span><strong id="totalSites">0</strong> sites</span>
                    <span><strong id="totalCategorias">0</strong> áreas</span>
                    <span><strong>2026</strong> atualizado</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="toolbar" aria-label="Controles da galeria">
            <div class="search-bar">
                <i class="fas fa-magnifying-glass search-icon" aria-hidden="true"></i>
                <input type="text" id="searchInput" placeholder="Buscar por tema ou autor...">
                <button id="searchBtn" aria-label="Buscar"><i class="fas fa-arrow-right"></i></button>
            </div>

            <div class="filter-buttons" aria-label="Categorias">
                <button class="filter-btn active" data-filter="all">Todos</button>
            </div>
        </section>

        <div class="gallery" id="gallery">
            <p class="loading-message">A carregar sites...</p>
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <i class="fas fa-search"></i>
            <p>Nenhum resultado encontrado</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Portal Sala LED. Projetos publicados pela turma.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
